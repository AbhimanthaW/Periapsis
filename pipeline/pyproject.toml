[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-window-pipeline"
version = "0.1.1"
description = "Reproducible Mars source ingestion and coordinate handling for Return Window"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "rasterio>=1.4.4,<1.5", "pyproj>=3.7.2,<3.8", "truststore>=0.10,<1"]

[project.scripts]
return-window = "return_window_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

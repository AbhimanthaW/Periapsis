name: Verify
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.web }}
      science: ${{ steps.scope.outputs.science }}
      pipeline: ${{ steps.scope.outputs.pipeline }}
      ranking: ${{ steps.scope.outputs.ranking }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in filter(None, tracked):
              p = Path(name)
              assert p.stat().st_size <= 2_000_000, name
              assert not p.is_symlink(), name
              assert not any(part in {".git", ".venv", "node_modules", ".env", "dist"}
                             or part.startswith(".env.") for part in p.parts), name
              assert p.suffix not in {".tif", ".tiff", ".f32", ".zip", ".bundle"}, name
          base = os.environ["BASE_SHA"]
          paths = [] if not base else subprocess.check_output(
              ["git", "diff", "--name-only", "-z", base, "HEAD"]
          ).decode().split("\0")
          changed = lambda *prefix: not base or any(path.startswith((".github/", *prefix)) for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"web={str(changed('web/')).lower()}", file=out)
              print(f"science={str(changed('documentation/', 'evidence/', 'web/src/atlas/regions.json', 'contracts/', 'runtime/', 'pipeline/scripts/', 'pipeline/evidence/arcadia-planitia/')).lower()}", file=out)
              print(f"pipeline={str(changed('pipeline/', 'evidence/mola/', 'contracts/', 'web/src/atlas/regions.json')).lower()}", file=out)
              print(f"ranking={str(changed('ranking/', 'tests/', 'runtime/', 'documentation/', 'contracts/', 'docs/region-ranking/')).lower()}", file=out)
          PY

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify mission frontend
        working-directory: web/mission-preview
        run: |
          npm ci
          npm run build
          npm run test:sites
          npm run test:methods
      - run: npm ci
      - run: npm run check:atlas && npm run build

  science:
    needs: scope
    if: needs.scope.outputs.science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project documentation --locked --python 3.12
      - run: uv run --project documentation --locked --offline python -m pytest documentation/tests contracts/tests runtime/tests -q -rs
      - run: uv run --project documentation --locked --offline python pipeline/evidence/arcadia-planitia/verify_handoff.py pipeline/evidence/arcadia-planitia --repo .
      - run: uv run --project documentation --locked --offline python -m runtime.mission simulate contracts/fixtures/synthetic-v1 --closure mid

  ranking:
    needs: scope
    if: needs.scope.outputs.ranking == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project documentation --locked --python 3.12
      - name: Download pinned cell-map releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download mars-cell-map-v0.1.0 --dir data/ranking-inputs \
            --pattern cells-enriched.ndjson.gz
          gh release download mars-cell-map-v0.2.0 --dir data/ranking-inputs \
            --pattern cell-ranking.ndjson.gz \
            --pattern ranking-features.json.gz \
            --pattern cells-enriched-sourced.ndjson.gz \
            --pattern sourced-catalogue-manifest.json
      - name: Build release and demo ranking packs
        run: |
          uv run --project documentation --locked --offline python -m ranking.build --release
          uv run --project documentation --locked --offline python -m ranking.build --with-demo --output data/ranking-demo
      - run: uv run --project documentation --locked --offline python -m pytest tests/ranking -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/mission-preview/package-lock.json
      - run: npm ci --prefix web && npm ci --prefix web/mission-preview
      - run: uv run --project documentation --locked --offline python -m runtime.release build data/offline-release --ranking-pack data/ranking-pack
      - name: Verify packaged browser and local API
        working-directory: web/mission-preview
        run: |
          npx playwright install --with-deps chromium --only-shell
          npx playwright test --config playwright.release.config.ts
          npm run build
          RW_UI_PRODUCTION=1 RW_UI_API_BUNDLE=data/offline-release npm run test:ui
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: return-window-offline-${{ github.sha }}
          path: data/offline-release
          if-no-files-found: error

  pipeline:
    needs: scope
    if: needs.scope.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv --python 3.11 .venv
          uv pip install -r requirements-lock.txt
          uv pip install --no-deps -e .
      - run: |
          export RW_MOLA_WORKSPACE="$RUNNER_TEMP/mola"
          .venv/bin/return-window ingest configs/mola-global-4ppd-topography.json --workspace "$RW_MOLA_WORKSPACE"
          .venv/bin/return-window verify-cache --workspace "$RW_MOLA_WORKSPACE"
          uv pip install --python .venv/bin/python scipy==1.17.1
          .venv/bin/python -m unittest discover -s tests -q
          .venv/bin/python scripts/check-mola.py --workspace "$RW_MOLA_WORKSPACE"

  preview:
    if: github.event_name == 'workflow_dispatch'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project documentation --locked --python 3.12 --group archive-check
      - run: |
          src=$(python3 -c 'import json; print(json.load(open("evidence/jezero/jezero.json"))["source"]["url"])')
          window=$(mktemp -d)
          curl --fail --silent --show-error --proto '=https' --max-filesize 90345300 --max-time 240 "$src" -o "$window/source.tif"
          cp evidence/jezero/jezero.json "$window/"
          uv run --project documentation --locked --offline --group archive-check python pipeline/scripts/verify_jezero.py "$window" --source "$window/source.tif" --reconstruct > "$window/evidence.json"
          cmp "$window/evidence.json" evidence/jezero/jezero-evidence.json
          RW_JEZERO_WINDOW="$window/jezero-elevation.f32" uv run --project documentation --locked --offline --group archive-check python -m pytest contracts/tests/test_producer_consumer.py -q

  required:
    if: always()
    needs: [scope, web, science, pipeline, ranking, preview]
    runs-on: ubuntu-latest
    env:
      SCOPE: ${{ needs.scope.result }}
      WEB: ${{ needs.web.result }}
      SCIENCE: ${{ needs.science.result }}
      PIPELINE: ${{ needs.pipeline.result }}
      RANKING: ${{ needs.ranking.result }}
      PREVIEW: ${{ needs.preview.result }}
    steps:
      - run: |
          test "$SCOPE" = success
          for result in "$WEB" "$SCIENCE" "$PIPELINE" "$RANKING" "$PREVIEW"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

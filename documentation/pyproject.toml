[project]
name = "return-window-marsdoc"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "astropy-healpix==1.1.3",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4.25,<5"]
archive-check = ["rasterio>=1.4,<2"]

[project.scripts]
marsdoc = "marsdoc.__main__:main"

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marsdoc*"]

[tool.setuptools.package-data]
marsdoc = ["scoring-v1.json"]
